# Reusable test -> build -> deploy pipeline for every UtilBots bot.
#
# A bot repo calls it with ~15 lines (see templates/bot/.github/workflows/deploy.yml):
#   jobs:
#     pipeline:
#       uses: UnheardOTP/utilbots-core/.github/workflows/deploy-bot.yml@v0
#       with: { slug: mediabot, port: 3501, deploy: ${{ vars.DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' }} }
#       secrets: inherit
#
# Server layout (created on first deploy):
#   /mnt/user/appdata/utilbots-shared/.env   tokens every bot shares (Stripe, admin IDs, file hosts...)
#   /mnt/user/appdata/<slug>/.env            this bot's own values (Discord app, DB password...)
#   /mnt/user/appdata/<slug>/docker-compose.prod.yml   copied from the repo on every deploy
name: UtilBots bot pipeline

on:
  workflow_call:
    inputs:
      slug:
        description: Bot slug, e.g. mediabot (subdomain, image name, compose project, deploy dir)
        type: string
        required: true
      port:
        description: Host port the web container is published on (Nginx Proxy Manager forwards here)
        type: number
        required: true
      deploy:
        description: Build and deploy (false = tests only, e.g. pull requests or before the bot is provisioned)
        type: boolean
        default: true
      python-version:
        type: string
        default: "3.12"
      deploy-host:
        type: string
        default: bamphbox.tail5ecf41.ts.net
      deploy-user:
        type: string
        default: root
      appdata:
        type: string
        default: /mnt/user/appdata
    secrets:
      TS_OAUTH_CLIENT_ID:
        required: false
      TS_OAUTH_SECRET:
        required: false
      DEPLOY_SSH_PASSWORD:
        required: false

concurrency:
  group: deploy-${{ inputs.slug }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  build:
    needs: test
    if: inputs.deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.slug }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          # Bots that need fresh dependencies on every build (e.g. yt-dlp) declare `ARG CACHEBUST` before that RUN.
          build-args: |
            CACHEBUST=${{ github.run_id }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ inputs.slug }}

  deploy:
    needs: build
    if: inputs.deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      SLUG: ${{ inputs.slug }}
      PORT: ${{ inputs.port }}
      HOST: ${{ inputs.deploy-host }}
      USER_AT_HOST: ${{ inputs.deploy-user }}@${{ inputs.deploy-host }}
      DIR: ${{ inputs.appdata }}/${{ inputs.slug }}
      SHARED: ${{ inputs.appdata }}/utilbots-shared
      IMAGE: ${{ needs.build.outputs.image }}
      TAG: ${{ github.sha }}
      SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          HAS_TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
          HAS_TS_SECRET: ${{ secrets.TS_OAUTH_SECRET != '' }}
        run: |
          missing=""
          [ "$HAS_TS_ID" = true ] || missing="$missing TS_OAUTH_CLIENT_ID"
          [ "$HAS_TS_SECRET" = true ] || missing="$missing TS_OAUTH_SECRET"
          [ -n "$SSHPASS" ] || missing="$missing DEPLOY_SSH_PASSWORD"
          [ -z "$missing" ] || { echo "::error::Missing repo secrets:$missing (run the new-bot skill's secrets step)"; exit 1; }

      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Prepare SSH
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          install -m 700 -d ~/.ssh
          # Reached over the authenticated tailnet, so trusting the scanned host key is acceptable.
          ssh-keyscan -T 10 "$HOST" >> ~/.ssh/known_hosts
          echo "SSH=sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes $USER_AT_HOST" >> "$GITHUB_ENV"
          echo "SCP=sshpass -e scp -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Bootstrap server
        run: |
          $SSH "SLUG='$SLUG' PORT='$PORT' DIR='$DIR' SHARED='$SHARED' bash -s" <<'EOS'
          set -euo pipefail
          umask 077
          mkdir -p "$DIR" "$SHARED"
          [ -f "$SHARED/.env" ] || { echo "# Tokens shared by every UtilBots bot" > "$SHARED/.env"; echo "created $SHARED/.env"; }
          touch "$DIR/.env"
          setdefault() { grep -q "^$1=" "$DIR/.env" || echo "$1=$2" >> "$DIR/.env"; }
          # Generated or derived once; never overwritten.
          setdefault POSTGRES_PASSWORD "$(openssl rand -hex 24)"
          setdefault SESSION_SECRET "$(openssl rand -hex 32)"
          setdefault PUBLIC_URL "https://$SLUG.utilbots.com"
          setdefault WEB_PORT "$PORT"
          missing=""
          for key in DISCORD_TOKEN DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET; do
            grep -q "^$key=." "$DIR/.env" || missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "::error::$DIR/.env is missing:$missing. Create the Discord application and run the new-bot skill's env step."
            exit 1
          fi
          EOS

      - name: Copy compose file
        run: $SCP docker-compose.prod.yml "$USER_AT_HOST:$DIR/docker-compose.prod.yml"

      - name: Pull and restart
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $SSH "SLUG='$SLUG' DIR='$DIR' IMAGE='$IMAGE' TAG='$TAG' GHCR_USER='$GHCR_USER' bash -s" <<EOS
          set -euo pipefail
          cd "\$DIR"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "\$GHCR_USER" --password-stdin >/dev/null
          # Unraid may lack the Compose plugin (Compose Manager Plus provides it). Fall back to a pinned,
          # checksummed v2 binary; Compose v1 crashes on recreate with newer engines.
          if docker compose version >/dev/null 2>&1; then
            COMPOSE="docker compose"
          else
            CV=v2.29.7
            CSUM=383ce6698cd5d5bbf958d2c8489ed75094e34a77d340404d9f32c4ae9e12baf0
            BIN="\$DIR/../utilbots-shared/docker-compose-\$CV"
            if [ ! -x "\$BIN" ]; then
              curl -fsSL -o "\$BIN.tmp" "https://github.com/docker/compose/releases/download/\$CV/docker-compose-linux-x86_64"
              echo "\$CSUM  \$BIN.tmp" | sha256sum -c -
              chmod +x "\$BIN.tmp" && mv "\$BIN.tmp" "\$BIN"
            fi
            COMPOSE="\$BIN"
          fi
          export IMAGE="\$IMAGE" IMAGE_TAG="\$TAG"
          C="\$COMPOSE -p \$SLUG -f docker-compose.prod.yml"
          timeout 600 \$C pull
          timeout 300 \$C up -d --remove-orphans
          docker logout ghcr.io >/dev/null
          timeout 60 docker image prune -f >/dev/null || true
          \$C ps
          EOS

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if $SSH "curl -fsS http://127.0.0.1:$PORT/healthz" | grep -q "\"bot\":\"$SLUG\""; then echo healthy; exit 0; fi
            sleep 3
          done
          echo "::error::$SLUG did not become healthy on port $PORT"
          $SSH "cd '$DIR' && docker compose -p '$SLUG' -f docker-compose.prod.yml logs --tail 80 2>/dev/null || docker logs --tail 80 '$SLUG-web-1'"
          exit 1
