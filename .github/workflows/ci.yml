name: Core tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[test]'
      - run: python -m pytest -q
      - name: Scaffold a throwaway bot and run its tests against this core
        run: |
          python skills/new-bot/scripts/scaffold.py --slug ci-checkbot --name CICheckBot --emoji 🧪 \
            --tagline "CI check." --port 3999 --out /tmp/ci-checkbot --no-registry --core-path "$PWD"
          cd /tmp/ci-checkbot && pip install -r requirements.txt && python -m pytest -q
